name: Refine VR interaction

on:
  push:
    branches:
      - feature/vr-interaction-controls
    paths:
      - 'scripts/refine_vr_interaction.py'
      - '.github/workflows/refine-vr-interaction.yml'

permissions:
  contents: write

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/vr-interaction-controls
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply refinement
        run: python3 scripts/refine_vr_interaction.py
      - name: Validate source
        run: |
          node --check public/immersive.js
          python3 scripts/verify_mobile_xr.py
      - name: Commit refinement
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/immersive.js
          git diff --cached --quiet && exit 0
          git commit -m 'Cache VR menu texture uploads'
          git push origin HEAD:feature/vr-interaction-controls
