name: Refine Sri Yantra petals and colors
on:
  push:
    paths:
      - '.github/workflows/refine-sri-petals-colors.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine Sri source patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('public/ui-fixes.js')
          s = p.read_text()

          replacements = {
            "16, 1.67, 0.30, 0.40,": "16, 1.51, 0.24, 0.46,",
            "8, 1.30, 0.36, 0.72,": "8, 1.25, 0.24, 0.78,",
            "[-0.771983,-0.157103,'green']": "[-0.771983,-0.157103,'ochre']",
            "[-0.562883,-0.400310,'orange']": "[-0.562883,-0.400310,'ochre']",
            "[0.378727,-0.626663,'terracotta']": "[0.378727,-0.626663,'orange']",
            "[0.562883,-0.400310,'orange']": "[0.562883,-0.400310,'ochre']",
            "[0.771983,-0.157103,'green']": "[0.771983,-0.157103,'ochre']",
            "[0.418803,0.334893,'terracotta']": "[0.418803,0.334893,'orange']",
            "[-0.135389,0.368602,'terracotta']": "[-0.135389,0.368602,'ochre']",
            "[0.409793,0.635560,'green']": "[0.409793,0.635560,'orange']",
            "[-0.094170,-0.047798,'orange']": "[-0.094170,-0.047798,'terracotta']",
            "[-0.178560,0.018600,'orange']": "[-0.178560,0.018600,'terracotta']",
            "[-0.121043,0.121953,'ochre']": "[-0.121043,0.121953,'orange']",
            "[0.121043,0.121953,'ochre']": "[0.121043,0.121953,'green']",
            "[-0.344526,0.023812,'ochre']": "[-0.344526,0.023812,'terracotta']",
            "[0.000000,0.552170,'green']": "[0.000000,0.552170,'ochre']",
            "[0.264956,0.114009,'ochre']": "[0.264956,0.114009,'terracotta']",
          }

          for old, new in replacements.items():
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one occurrence of {old!r}, found {count}')
              s = s.replace(old, new)

          p.write_text(s)
          PY
      - name: Validate JavaScript
        run: node --check public/ui-fixes.js
      - name: Commit refinement
        run: |
          git config user.name 'Mario Marcolongo'
          git config user.email 'mario.marcolongo1@gmail.com'
          git add public/ui-fixes.js
          git commit -m 'Refine Sri Yantra petal spacing and reference colors'
          git push
