name: Refine mobile XR
on:
  push:
    branches:
      - fix/mobile-xr-performance-framing
    paths:
      - 'scripts/refine_mobile_xr.py'
      - '.github/workflows/refine-mobile-xr.yml'
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-xr-performance-framing
          fetch-depth: 0
      - name: Apply recenter refinement
        run: python3 scripts/refine_mobile_xr.py
      - name: Verify source
        run: |
          node --check public/immersive.js
          python3 scripts/verify_math_rigor.py
          python3 scripts/verify_ui_harmony.py
          grep -q "xrFitProjectedPoints" public/immersive.js
          grep -q "model\[8\] = matrix\[8\]" public/immersive.js
      - name: Commit refined XR source
        run: |
          if git diff --quiet public/immersive.js; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/immersive.js
          git commit -m 'Align mobile VR recentering to viewer pose'
          git push origin HEAD:fix/mobile-xr-performance-framing
