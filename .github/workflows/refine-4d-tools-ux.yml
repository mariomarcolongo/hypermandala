name: Refine 4D tools UX

on:
  push:
    branches:
      - fix/4d-tools-ux

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/4d-tools-ux
          fetch-depth: 0
      - name: Apply UX patch
        run: python3 .github/scripts/refine_4d_tools_ux.py
      - name: Validate scripts
        run: |
          node --check public/app.js
          node --check public/ui-fixes.js
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html public/styles.css README.md
          git commit -m "Simplify 4D tools UI and transparency wording"
          git push origin HEAD:fix/4d-tools-ux
