name: Apply immersive integration

on:
  push:
    branches:
      - feature/immersive-4d-mandala
    paths:
      - scripts/apply_immersive_integration.py
      - .github/workflows/apply-immersive-integration.yml

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/immersive-4d-mandala
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Adapt deterministic migration to current source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply_immersive_integration.py')
          s = p.read_text()

          replacements = [
            (
              '''    if count != 1:\n        raise RuntimeError(f"{label}: expected exactly one match, found {count}")\n    return text.replace(old, new, 1)''',
              '''    if label == "reset perception offsets":\n        if count != 2:\n            raise RuntimeError(f"{label}: expected exactly two matches, found {count}")\n        return text.replace(old, new)\n    if count != 1:\n        raise RuntimeError(f"{label}: expected exactly one match, found {count}")\n    return text.replace(old, new, 1)''',
            ),
            ('def check_exact_4d_perspective() -> None:', 'def check_4d_perspective() -> None:'),
            ('assert_close(dot, expected, 1e-12, f"SO(4) Gram[{i},{j}]")', 'assert abs(dot - expected) < 1e-12, (i, j, dot)'),
            ('assert_close(determinant(basis), 1.0, 1e-12, "SO(4) determinant")', 'assert abs(determinant(basis) - 1.0) < 1e-12, determinant(basis)'),
            ('        "X-ray should not disable depth testing",\\n    ]', '        "bayer[16]",\\n    ]'),
            ('        "X-ray should not disable depth testing",\\n        "function validate4DTransform()",', '        "bayer[16]",\\n        "function validate4DTransform()",'),
            ('    check_plane_rotations_preserve_norm()\\n    check_rotation_order_noncommutative()\\n', '    check_4d_rotations()\\n    check_rotation_noncommutativity()\\n'),
            ('    check_plane_rotations_preserve_norm()\\n    check_rotation_order_noncommutative()\\n    check_composed_so4_rotation()\\n', '    check_4d_rotations()\\n    check_rotation_noncommutativity()\\n    check_composed_so4_rotation()\\n'),
          ]

          for old, new in replacements:
              if old in s:
                  s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Integrate immersive perception layer
        run: python3 scripts/apply_immersive_integration.py

      - name: Verify JavaScript syntax
        run: |
          node --check public/app.js
          node --check public/immersive.js

      - name: Verify mathematical and source invariants
        run: python3 scripts/verify_math_rigor.py

      - name: Verify patch integrity
        run: git diff --check

      - name: Commit integrated source
        run: |
          git checkout -- scripts/apply_immersive_integration.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app.js public/index.html public/styles.css public/_headers README.md scripts/verify_math_rigor.py
          git commit -m "Integrate immersive 4D perception [immersive-integrated]"
          git push origin HEAD:feature/immersive-4d-mandala
