name: Hotfix Sri Yantra normalization freeze

on:
  push:
    paths:
      - '.github/workflows/hotfix-sri-normalization.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Sri normalization hotfix
        run: node scripts/hotfix-sri-normalization.mjs

      - name: Validate JavaScript
        run: node --check public/app.js

      - name: Commit hotfix and remove one-off files
        run: |
          rm scripts/hotfix-sri-normalization.mjs
          rm .github/workflows/hotfix-sri-normalization.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app.js scripts/hotfix-sri-normalization.mjs .github/workflows/hotfix-sri-normalization.yml
          git commit -m "Fix Sri Yantra selection freeze"
          git push
