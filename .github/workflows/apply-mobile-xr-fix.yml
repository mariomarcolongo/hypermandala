name: Apply mobile XR fix
on:
  push:
    branches:
      - fix/mobile-xr-performance-framing
    paths:
      - 'scripts/apply_mobile_xr_fix.py'
      - 'scripts/fix_mobile_xr_migration.py'
      - '.github/workflows/apply-mobile-xr-fix.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-xr-performance-framing
          fetch-depth: 0
      - name: Repair migration boundaries
        run: python3 scripts/fix_mobile_xr_migration.py
      - name: Apply mobile XR repair
        run: python3 scripts/apply_mobile_xr_fix.py
      - name: Verify syntax and invariants
        run: |
          node --check public/immersive.js
          python3 scripts/verify_math_rigor.py
          python3 scripts/verify_ui_harmony.py
          grep -q "framebufferScaleFactor: perception.xrFramebufferScale" public/immersive.js
          grep -q "recenterXRFromPose" public/immersive.js
          grep -q "xrGeometryStateKey" public/immersive.js
      - name: Commit repaired XR source
        run: |
          if git diff --quiet public/immersive.js; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/immersive.js
          git commit -m 'Fix mobile VR performance and framing'
          git push origin HEAD:fix/mobile-xr-performance-framing
