name: Clean observer orbit copy
on:
  push:
    branches:
      - fix/projection-perception-audit
    paths:
      - '.github/workflows/clean-observer-orbit-copy.yml'
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/projection-perception-audit
          fetch-depth: 0
      - name: Replace stale motion-parallax wording
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('public/immersive.js')
          s = p.read_text()
          replacements = {
            'Motion parallax enabled for pointer input; device orientation permission was not granted.': 'Observer orbit enabled for pointer input; device orientation permission was not granted.',
            'Motion parallax enabled for pointer input; device orientation is unavailable.': 'Observer orbit enabled for pointer input; device orientation is unavailable.',
            "setStatus(perception.parallax ? 'Motion parallax moves only the 3D observer.' : 'Motion parallax off.');": "setStatus(perception.parallax ? 'Observer orbit changes only the ordinary 3D camera orientation.' : 'Observer orbit off.');",
          }
          for old, new in replacements.items():
            if s.count(old) != 1:
              raise SystemExit(f'expected exactly one: {old}')
            s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          node --check public/immersive.js
          python3 scripts/verify_math_rigor.py
          python3 scripts/verify_ui_harmony.py
      - name: Commit copy cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/immersive.js
          git commit -m 'Remove stale motion-parallax wording'
          git push origin HEAD:fix/projection-perception-audit
