name: Patch 4D perception

on:
  push:
    branches:
      - "fix/4d-perception"

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/4d-perception
          fetch-depth: 0

      - name: Apply renderer and UX patch
        run: python3 .github/scripts/patch_4d_perception.py

      - name: Syntax checks
        run: |
          node --check public/app.js
          node --check public/ui-fixes.js

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app.js public/index.html public/styles.css public/ui-fixes.js README.md
          git commit -m "Add correct 4D inspection and X-ray rendering"
          git push origin HEAD:fix/4d-perception
