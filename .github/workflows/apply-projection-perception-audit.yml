name: Apply projection perception audit
on:
  push:
    branches:
      - fix/projection-perception-audit
    paths:
      - 'scripts/apply_projection_perception_audit.py'
      - '.github/workflows/apply-projection-perception-audit.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/projection-perception-audit
          fetch-depth: 0
      - name: Apply audited projection fixes
        run: python3 scripts/apply_projection_perception_audit.py
      - name: Verify JavaScript syntax
        run: |
          node --check public/immersive.js
          node --check public/app.js
      - name: Verify mathematical rigor
        run: python3 scripts/verify_math_rigor.py
      - name: Commit generated source changes
        run: |
          if git diff --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/immersive.js public/index.html public/ui-harmony.css README.md scripts/verify_math_rigor.py
          git commit -m 'Fix projection and stereo perception issues'
          git push origin HEAD:fix/projection-perception-audit
