name: Apply Sri Yantra native patch

on:
  push:
    paths:
      - '.github/workflows/apply-sri-native.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch app geometry
        run: node scripts/apply-sri-native-patch.mjs

      - name: Validate JavaScript
        run: node --check public/app.js

      - name: Restore ui-fixes to UI-only hooks
        run: git show 52f7eb343b4e0bccc64c283e71e15450400a9b92:public/ui-fixes.js > public/ui-fixes.js

      - name: Commit native implementation and remove one-off patch files
        run: |
          rm scripts/apply-sri-native-patch.mjs
          rm .github/workflows/apply-sri-native.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app.js public/ui-fixes.js scripts/apply-sri-native-patch.mjs .github/workflows/apply-sri-native.yml
          git commit -m "Rebuild Sri Yantra in native geometry engine"
          git push
