name: Diagnose 4D tools in browser
on:
  push:
    paths:
      - '.github/workflows/diagnose-4d-browser.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test dependency
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Run local interaction and visual test
        run: |
          python3 -m http.server 8765 --directory public >/tmp/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          cat > test-4d-browser.mjs <<'JS'
          import { chromium } from 'playwright';
          import { createHash } from 'node:crypto';

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
          page.on('console', msg => console.log('CONSOLE', msg.type(), msg.text()));
          page.on('pageerror', err => console.log('PAGEERROR', err.stack || err.message));
          await page.goto('http://127.0.0.1:8765/', { waitUntil: 'networkidle' });
          console.log('PATCH', await page.evaluate(() => window.__hypermandala4DInspectionPatch || null));

          await page.locator('[data-dimension="4"]').click();
          await page.waitForTimeout(5000);
          const details = page.locator('.perception-details');
          await details.locator('summary').click();
          console.log('DETAILS_OPEN', await details.evaluate(el => el.open));

          const hash = async (selector) => {
            const buffer = await page.locator(selector).screenshot();
            return createHash('sha256').update(buffer).digest('hex').slice(0, 16);
          };
          const snapshot = async (label) => {
            await page.waitForTimeout(250);
            const result = {
              solid: await hash('#solidLayer'),
              overlay: await hash('#mandala'),
            };
            console.log('VISUAL', label, result);
            return result;
          };
          const changed = (a, b) => a.solid !== b.solid || a.overlay !== b.overlay;

          const baseline = await snapshot('baseline');

          await page.locator('[data-insight="w-slice"]').click();
          const slice = await snapshot('slice');
          console.log('CHANGED slice', changed(baseline, slice));

          await page.locator('#wSliceSweep').click();
          await page.waitForTimeout(1200);
          const sweep = await snapshot('sweep');
          console.log('CHANGED sweep', changed(slice, sweep));

          await page.locator('#wDepthToggle').click();
          const wdepth = await snapshot('wdepth');
          console.log('CHANGED wdepth', changed(sweep, wdepth));

          await page.locator('#hypercellToggle').click();
          const hypercell = await snapshot('hypercell');
          console.log('CHANGED hypercell', changed(wdepth, hypercell));

          await page.locator('[data-w-section-space="view"]').click();
          const view = await snapshot('view-space');
          console.log('CHANGED view-space', changed(hypercell, view));

          const failures = [];
          if (!changed(baseline, slice)) failures.push('slice');
          if (!changed(slice, sweep)) failures.push('sweep');
          if (!changed(sweep, wdepth)) failures.push('w-depth');
          if (!changed(wdepth, hypercell)) failures.push('hypercell');
          if (failures.length) throw new Error('No visible render change for: ' + failures.join(', '));

          await browser.close();
          JS
          node test-4d-browser.mjs
