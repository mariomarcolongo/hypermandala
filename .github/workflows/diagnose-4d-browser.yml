name: Diagnose 4D tools in browser
on:
  pull_request:
    paths:
      - '.github/workflows/diagnose-4d-browser.yml'
      - 'public/tutorial-descriptions.js'
      - 'public/index.html'
      - 'public/styles.css'
      - 'public/app.js'
      - 'public/immersive.js'
  push:
    paths:
      - '.github/workflows/diagnose-4d-browser.yml'
      - 'public/tutorial-descriptions.js'
      - 'public/index.html'
      - 'public/styles.css'
      - 'public/app.js'
      - 'public/immersive.js'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test dependency
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run local interaction and geometry test
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          python3 -m http.server 8765 --directory public >/tmp/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          cat > test-4d-browser.mjs <<'JS'
          import { chromium, webkit } from 'playwright';
          import { createHash } from 'node:crypto';

          const browserType = process.env.BROWSER === 'webkit' ? webkit : chromium;
          const browser = await browserType.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
          const pageErrors = [];
          page.on('console', msg => console.log('CONSOLE', msg.type(), msg.text()));
          page.on('pageerror', err => {
            pageErrors.push(err.message);
            console.log('PAGEERROR', err.stack || err.message);
          });
          await page.goto('http://127.0.0.1:8765/', { waitUntil: 'networkidle' });
          console.log('BROWSER', process.env.BROWSER);
          console.log('NATIVE_4D_TOOLS', await page.locator('#hypermandala4DInspectionTools').count());
          if (await page.locator('#hypermandala4DInspectionTools').count() !== 1) {
            throw new Error('Native 4D tools are missing or duplicated');
          }

          for (const id of ['stereoToggle', 'stereoSwap', 'motionParallaxToggle', 'trajectoryToggle', 'enterVr']) {
            if (await page.locator('#' + id).count() !== 1) {
              throw new Error('Immersive control missing or duplicated: ' + id);
            }
          }
          if (!(await page.evaluate(() => Boolean(window.HypermandalaAPI)))) {
            throw new Error('HypermandalaAPI geometry bridge is unavailable');
          }

          await page.locator('[data-dimension="4"]').click();
          await page.waitForTimeout(5000);
          const details = page.locator('.perception-details');
          await details.locator('summary').click();
          console.log('DETAILS_OPEN', await details.evaluate(el => el.open));

          const transformValidation = await page.evaluate(() => window.__hypermandalaDebug.validate4DTransform());
          console.log('SO4_TRANSFORM', transformValidation);
          if (!transformValidation.ok) {
            throw new Error('Composed 4D transform is not a valid SO(4) transform: ' + JSON.stringify(transformValidation));
          }

          const assertExplorerLayout = async (label) => {
            const layout = await page.evaluate(() => {
              const panel = document.getElementById('explorerControls');
              const basis = document.getElementById('basisGizmo');
              const panelRect = panel.getBoundingClientRect();
              const basisRect = basis.getBoundingClientRect();
              const basisStyle = getComputedStyle(basis);
              const basisVisible = (
                basisStyle.display !== 'none'
                && basisStyle.visibility !== 'hidden'
                && Number(basisStyle.opacity || 1) > 0
                && basisRect.width > 0
                && basisRect.height > 0
              );
              const overlap = !(
                panelRect.right <= basisRect.left
                || basisRect.right <= panelRect.left
                || panelRect.bottom <= basisRect.top
                || basisRect.bottom <= panelRect.top
              );
              return {
                viewport: [innerWidth, innerHeight],
                panel: { top: panelRect.top, right: panelRect.right, bottom: panelRect.bottom, left: panelRect.left, width: panelRect.width, height: panelRect.height },
                basis: { top: basisRect.top, right: basisRect.right, bottom: basisRect.bottom, left: basisRect.left, width: basisRect.width, height: basisRect.height, display: basisStyle.display },
                basisVisible,
                overlap,
              };
            });
            console.log('LAYOUT', label, layout);
            if (!layout.basisVisible) throw new Error(`${label}: projected basis is hidden`);
            if (layout.overlap) throw new Error(`${label}: Explorer overlaps projected basis`);
            if (layout.panel.height >= layout.viewport[1] * 0.8) throw new Error(`${label}: Explorer is excessively tall`);
          };

          await assertExplorerLayout('desktop');
          await page.setViewportSize({ width: 900, height: 800 });
          await page.waitForTimeout(200);
          await assertExplorerLayout('compact-desktop');
          await page.setViewportSize({ width: 1440, height: 1000 });
          await page.waitForTimeout(200);

          for (const complexity of ['simple', 'complex']) {
            await page.locator('[data-complexity="' + complexity + '"]').click();
            const presetNames = await page.locator('[data-preset]').evaluateAll((els) => els.map((el) => el.dataset.preset));
            for (const preset of presetNames) {
              await page.locator('[data-preset="' + preset + '"]').evaluate((el) => el.click());
              await page.waitForTimeout(25);
              const validation = await page.evaluate(() => window.__hypermandalaDebug.validateCurrentGeometry());
              console.log('GEOMETRY', complexity, preset, validation);
              if (!validation.ok) {
                throw new Error(complexity + '/' + preset + ': ' + validation.issues.join(' | '));
              }
            }
          }
          await page.locator('[data-preset="square"]').evaluate((el) => el.click());
          await page.locator('[data-complexity="complex"]').click();

          await page.locator('[data-projection="orthographic"]').click();
          await page.locator('[data-screen-projection="perspective"]').click();
          await page.locator('#isometricView').click();
          let projectionState = await page.evaluate(() => window.__hypermandalaDebug.projectionState());
          if (projectionState.projection4D !== 'orthographic' || projectionState.projection3D !== 'perspective' || !projectionState.isometricView) {
            throw new Error('Projection stages are not independent: ' + JSON.stringify(projectionState));
          }
          await page.locator('[data-projection="perspective"]').click();
          await page.locator('[data-screen-projection="perspective"]').click();
          await page.locator('#isometricView').click();

          const hash = async (selector) => {
            const buffer = await page.locator(selector).screenshot();
            return createHash('sha256').update(buffer).digest('hex').slice(0, 16);
          };
          const snapshot = async (label) => {
            await page.waitForTimeout(250);
            const result = { solid: await hash('#solidLayer'), overlay: await hash('#mandala') };
            console.log('VISUAL', label, result);
            return result;
          };
          const changed = (a, b) => a.solid !== b.solid || a.overlay !== b.overlay;
          const baseline = await snapshot('baseline');

          // Stereo must produce a real two-eye view, and swapping eyes must
          // produce a distinct image rather than only relabeling the control.
          const blankPerception = await hash('#perceptionOverlay');
          await page.locator('#stereoToggle').click();
          await page.waitForTimeout(400);
          const stereo = await hash('#perceptionOverlay');
          if (stereo === blankPerception) throw new Error('Stereo pair did not render');
          if ((await page.locator('#stereoSwap').isDisabled())) throw new Error('Stereo eye swap remained disabled');
          await page.locator('#stereoSwap').click();
          await page.waitForTimeout(250);
          const stereoSwapped = await hash('#perceptionOverlay');
          if (stereoSwapped === stereo) throw new Error('Eye swap did not change the stereo render');
          await page.locator('#stereoToggle').click();
          await page.waitForTimeout(150);

          // Motion parallax must move the projected view while leaving the
          // intrinsic scene key untouched.
          const intrinsicKeyBeforeParallax = await page.evaluate(() => window.HypermandalaAPI.sceneKey());
          const parallaxBefore = await hash('#mandala');
          await page.locator('#motionParallaxToggle').click();
          await page.mouse.move(1360, 220);
          await page.waitForTimeout(450);
          const parallaxAfter = await hash('#mandala');
          const intrinsicKeyAfterParallax = await page.evaluate(() => window.HypermandalaAPI.sceneKey());
          if (parallaxBefore === parallaxAfter) throw new Error('Motion parallax did not alter the camera view');
          if (intrinsicKeyBeforeParallax !== intrinsicKeyAfterParallax) throw new Error('Motion parallax mutated intrinsic geometry');
          await page.locator('#motionParallaxToggle').click();
          await page.waitForTimeout(250);

          // A true 4D drag must leave a visible trajectory of transformed 4D
          // points without changing the intrinsic scene topology.
          await page.locator('#trajectoryToggle').click();
          const trajectoryBefore = await hash('#perceptionOverlay');
          const intrinsicKeyBeforeTrajectory = await page.evaluate(() => window.HypermandalaAPI.sceneKey());
          const canvasBox = await page.locator('#mandala').boundingBox();
          if (!canvasBox) throw new Error('Mandala canvas has no bounding box');
          const cx = canvasBox.x + canvasBox.width * 0.52;
          const cy = canvasBox.y + canvasBox.height * 0.52;
          await page.mouse.move(cx, cy);
          await page.mouse.down();
          await page.mouse.move(cx + 120, cy - 70, { steps: 10 });
          await page.mouse.up();
          await page.waitForTimeout(500);
          const trajectoryAfter = await hash('#perceptionOverlay');
          const intrinsicKeyAfterTrajectory = await page.evaluate(() => window.HypermandalaAPI.sceneKey());
          if (trajectoryBefore === trajectoryAfter) throw new Error('4D trajectory did not respond to 4D rotation');
          if (intrinsicKeyBeforeTrajectory !== intrinsicKeyAfterTrajectory) throw new Error('4D trajectory mutated intrinsic topology');
          await page.locator('#trajectoryToggle').click();

          // Headless CI normally has no immersive XR device. The progressive
          // enhancement must therefore remain safe and simply expose a disabled
          // button rather than throwing page errors.
          console.log('XR_BUTTON_DISABLED', await page.locator('#enterVr').isDisabled());

          const viewButton = page.locator('[data-w-section-space="view"]');
          console.log('VIEW_DISABLED_BEFORE', await viewButton.isDisabled());
          await viewButton.click();
          await page.waitForTimeout(150);
          const sliceButton = page.locator('[data-insight="w-slice"]');
          if (!(await sliceButton.getAttribute('class') || '').includes('is-active')) {
            throw new Error('View-space W did not self-activate one section');
          }
          const slice = await snapshot('view-space-section');

          await page.locator('[data-insight="standard"]').click();
          const sweepButton = page.locator('#wSliceSweep');
          await sweepButton.click();
          await page.waitForTimeout(900);
          if (!(await sliceButton.getAttribute('class') || '').includes('is-active')) {
            throw new Error('Sweep did not self-activate one section');
          }
          const sweep = await snapshot('sweep');

          await page.locator('#wDepthToggle').click();
          const wdepth = await snapshot('wdepth');
          await page.locator('#hypercellToggle').click();
          const hypercell = await snapshot('hypercell');

          const changes = {
            slice: changed(baseline, slice),
            sweep: changed(slice, sweep),
            wdepth: changed(sweep, wdepth),
            hypercell: changed(wdepth, hypercell),
          };
          console.log('CHANGES', changes);
          const failures = Object.entries(changes).filter(([, didChange]) => !didChange).map(([name]) => name);
          if (failures.length) throw new Error('No visible render change for: ' + failures.join(', '));
          if (pageErrors.length) throw new Error('Browser page errors: ' + pageErrors.join(' | '));

          await browser.close();
          JS
          node test-4d-browser.mjs
