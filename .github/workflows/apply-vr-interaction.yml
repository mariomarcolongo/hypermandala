name: Apply VR interaction migration

on:
  push:
    branches:
      - feature/vr-interaction-controls
    paths:
      - 'scripts/apply_vr_interaction.py'
      - '.github/workflows/apply-vr-interaction.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/vr-interaction-controls
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply migration
        run: python3 scripts/apply_vr_interaction.py
      - name: Validate JavaScript syntax
        run: |
          node --check public/app.js
          node --check public/immersive.js
      - name: Verify mobile XR controls
        run: python3 scripts/verify_mobile_xr.py
      - name: Commit generated source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/app.js public/immersive.js scripts/verify_mobile_xr.py
          git diff --cached --quiet && exit 0
          git commit -m 'Add gaze-driven VR interaction controls'
          git push origin HEAD:feature/vr-interaction-controls
