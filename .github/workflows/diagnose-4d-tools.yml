name: Diagnose 4D tools bootstrap
on:
  push:
    paths:
      - '.github/workflows/diagnose-4d-tools.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply bootstrap to current app source
        run: |
          cat > /tmp/test-4d.mjs <<'JS'
          import fs from 'node:fs';
          import vm from 'node:vm';

          const appSource = fs.readFileSync('public/app.js', 'utf8');
          const patchSource = fs.readFileSync('public/4d-tools-fix.js', 'utf8');

          globalThis.window = globalThis;
          window.fetch = async (input) => {
            const url = typeof input === 'string' ? input : input?.url || '';
            if (/app\.js(?:[?#]|$)/.test(url)) {
              return new Response(appSource, { status: 200, headers: { 'content-type': 'text/javascript' } });
            }
            return new Response('', { status: 404 });
          };
          globalThis.document = {
            getElementById() { return null; },
            querySelector() { return null; },
            querySelectorAll() { return []; },
            createElement() { return { style: {}, append() {}, setAttribute() {}, insertAdjacentElement() {} }; },
            head: { appendChild() {} },
          };

          vm.runInThisContext(patchSource, { filename: '4d-tools-fix.js' });
          const response = await window.fetch('./app.js');
          const patched = await response.text();
          fs.writeFileSync('/tmp/patched-app.js', patched);
          console.log('PATCH_META', JSON.stringify(window.__hypermandala4DInspectionPatch || null));
          console.log('EVENT_LISTENER_INSERTED', patched.includes("wSliceSweepButton?.addEventListener('click'"));
          console.log('SECTION_RENDERER_INSERTED', patched.includes('function drawViewSpaceWSection'));
          console.log('UI_STATE_INSERTED', patched.includes('const sectionEnabled = ('));
          JS
          node /tmp/test-4d.mjs
          node --check /tmp/patched-app.js
