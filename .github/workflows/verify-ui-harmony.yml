name: Verify UI harmony

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ui-harmony:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Explorer taxonomy and perception guards
        run: python3 scripts/verify_ui_harmony.py
      - name: Verify immersive JavaScript syntax
        run: node --check public/immersive.js
      - name: Verify Learn 4D JavaScript syntax
        run: |
          node --check public/tutorial-fluid.js
          node --check public/tutorial-build-rotation.js
          node --check public/tutorial-perception.js
      - name: Verify Learn 4D perception integration
        run: python3 scripts/verify_learn4d_perception.py
