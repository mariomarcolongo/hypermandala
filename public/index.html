<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#070809" />
  <meta name="description" content="Structured 2D plans unfolding into intrinsic 3D forms and interactive 4D projections." />
  <title>Hypermandala</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <canvas id="solidLayer" aria-hidden="true"></canvas>
  <canvas id="mandala" aria-label="Interactive 2D, 3D and 4D geometric form explorer"></canvas>

  <header class="brand">
    <div class="brand__name">Hypermandala</div>
    <div class="brand__tagline">plan · form · hyperform</div>
  </header>

  <div class="dimension-readout" aria-live="polite">
    <strong id="dimensionValue">2D</strong>
    <span id="dimensionStatus">mandala plan</span>
  </div>

  <nav class="dimension-switcher" aria-label="Choose dimension">
    <button type="button" data-dimension="2" class="is-active">2D</button>
    <button type="button" data-dimension="3">3D</button>
    <button type="button" data-dimension="4">4D</button>
  </nav>

  <aside class="control-panel" aria-label="4D explorer controls">
    <div class="control-panel__title">
      <span>Explorer</span>
      <button id="resetAll" type="button">reset</button>
    </div>

    <section class="control-section">
      <div class="control-section__label">Projection</div>
      <div class="segmented segmented--three" id="projectionControl">
        <button type="button" data-projection="perspective" class="is-active">Perspective</button>
        <button type="button" data-projection="orthographic">Ortho</button>
        <button type="button" data-projection="isometric" title="Orthographic 3D view with equal X/Y/Z foreshortening">Isometric</button>
      </div>
    </section>

    <section class="control-section">
      <div class="control-section__label">Rendering</div>
      <div class="segmented segmented--three" id="renderControl">
        <button type="button" data-render="solid" class="is-active">Solid</button>
        <button type="button" data-render="solid-edges" title="Solid faces with visible black contours plus the full structural wireframe">Solid + wireframe</button>
        <button type="button" data-render="wire">Wire</button>
      </div>
    </section>

    <section class="control-section">
      <div class="control-section__label">Color</div>
      <div class="segmented segmented--three" id="colorControl">
        <button type="button" data-color="classic" class="is-active" title="Family-specific classic colors">Classic</button>
        <button type="button" data-color="form">Form</button>
        <button type="button" data-color="axis">Axis</button>
      </div>
    </section>

    <section class="control-section rotation-section">
      <div class="control-section__head">
        <span class="control-section__label">Rotation planes</span>
        <span class="control-section__note">drag → XZ/YZ · A auto</span>
      </div>
      <div id="rotationRows" class="control-rows"></div>
    </section>

    <section class="control-section scale-section">
      <div class="control-section__head">
        <span class="control-section__label">Dimension stretch</span>
        <span class="control-section__note">1 normal · 0 collapse</span>
      </div>
      <div id="scaleRows" class="control-rows"></div>
    </section>
  </aside>

  <aside class="mandala-dock" id="geometricFormsDock" aria-label="Geometric form library">
    <div class="mandala-dock__header">
      <div class="mandala-dock__title">Geometric forms</div>
      <button
        id="toggleGeometricForms"
        class="mandala-dock__toggle"
        type="button"
        aria-expanded="true"
        aria-controls="geometricFormsBody"
        title="Collapse geometric forms"
      >⌄</button>
    </div>
    <div class="mandala-dock__body" id="geometricFormsBody">
      <div class="mandala-library" id="presetControl">
        <button type="button" class="mandala-card is-active" data-preset="square">
          <canvas id="previewSquare" width="120" height="120" aria-hidden="true"></canvas>
          <span>Square</span>
        </button>
        <button type="button" class="mandala-card" data-preset="sriyantra">
          <canvas id="previewSriYantra" width="120" height="120" aria-hidden="true"></canvas>
          <span>Sri Yantra</span>
        </button>
        <button type="button" class="mandala-card" data-preset="kaliyantra">
          <canvas id="previewKaliYantra" width="120" height="120" aria-hidden="true"></canvas>
          <span>Kali Yantra</span>
        </button>
        <button type="button" class="mandala-card" data-preset="matangiyantra">
          <canvas id="previewMatangiYantra" width="120" height="120" aria-hidden="true"></canvas>
          <span>Matangi Yantra</span>
        </button>
        <button type="button" class="mandala-card" data-preset="hex">
          <canvas id="previewHex" width="120" height="120" aria-hidden="true"></canvas>
          <span>Hex</span>
        </button>
        <button type="button" class="mandala-card" data-preset="stupa">
          <canvas id="previewStupa" width="120" height="120" aria-hidden="true"></canvas>
          <span>Stupa</span>
        </button>
        <button type="button" class="mandala-card" data-preset="borobudur">
          <canvas id="previewBorobudur" width="120" height="120" aria-hidden="true"></canvas>
          <span>Borobudur</span>
        </button>
        <button type="button" class="mandala-card" data-preset="castel">
          <canvas id="previewCastel" width="120" height="120" aria-hidden="true"></canvas>
          <span>Castel del Monte</span>
        </button>
        <button type="button" class="mandala-card" data-preset="kukulkan">
          <canvas id="previewKukulkan" width="120" height="120" aria-hidden="true"></canvas>
          <span>Kukulcán</span>
        </button>
        <button type="button" class="mandala-card" data-preset="lalibela">
          <canvas id="previewLalibela" width="120" height="120" aria-hidden="true"></canvas>
          <span>Bete Giyorgis</span>
        </button>
      </div>
      <div class="mandala-dock__options">
        <div class="dock-option">
          <span>Complexity</span>
          <div class="segmented" id="complexityControl">
            <button type="button" data-complexity="simple" class="is-active">Simple</button>
            <button type="button" data-complexity="complex">Complex</button>
          </div>
        </div>
        <div class="dock-option">
          <span>Spacing</span>
          <div class="segmented" id="spacingControl">
            <button type="button" data-spacing="compact" class="is-active">Compact</button>
            <button type="button" data-spacing="separated">Separated</button>
          </div>
        </div>
      </div>
    </div>
  </aside>

  <div class="basis-gizmo" id="basisGizmo" aria-label="Projected coordinate basis">
    <canvas id="basisCanvas" width="150" height="150"></canvas>
    <span>projected basis</span>
  </div>

  <div class="hint" id="hint">drag: XY in 2D · XZ/YZ in 3D/4D · shift-drag: XY · scroll: zoom</div>

  <a class="source" href="https://github.com/jnton/hypermandala" target="_blank" rel="noreferrer">source</a>

  <noscript><div class="noscript">Hypermandala needs JavaScript to render the interactive geometry.</div></noscript>
  <script src="./app.js" defer></script>
</body>
</html>
