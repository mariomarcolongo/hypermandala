<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#070809" />
  <meta name="description" content="A geometric mandala that unfolds from squares to cubes to 4D hypercubes." />
  <title>Hypermandala</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <canvas id="mandala" aria-label="Interactive 2D, 3D and 4D geometric mandala explorer"></canvas>

  <header class="brand">
    <div class="brand__name">Hypermandala</div>
    <div class="brand__tagline">square · cube · hypercube</div>
  </header>

  <div class="dimension-readout" aria-live="polite">
    <strong id="dimensionValue">2D</strong>
    <span id="dimensionStatus">mandala plan</span>
  </div>

  <nav class="dimension-switcher" aria-label="Choose dimension">
    <button type="button" data-dimension="2" class="is-active">2D</button>
    <button type="button" data-dimension="3">3D</button>
    <button type="button" data-dimension="4">4D</button>
  </nav>

  <aside class="control-panel" aria-label="4D explorer controls">
    <div class="control-panel__title">
      <span>Explorer</span>
      <button id="resetAll" type="button">reset</button>
    </div>

    <section class="control-section">
      <div class="control-section__label">Projection</div>
      <div class="segmented" id="projectionControl">
        <button type="button" data-projection="perspective" class="is-active">Perspective</button>
        <button type="button" data-projection="orthographic">Orthographic</button>
      </div>
    </section>

    <section class="control-section">
      <div class="control-section__label">Rendering</div>
      <div class="segmented segmented--three" id="renderControl">
        <button type="button" data-render="wire">Wire</button>
        <button type="button" data-render="solid">Solid</button>
        <button type="button" data-render="solid-edges" class="is-active">Solid + edges</button>
      </div>
    </section>

    <section class="control-section">
      <div class="control-section__label">Color</div>
      <div class="segmented" id="colorControl">
        <button type="button" data-color="form" class="is-active">Form</button>
        <button type="button" data-color="axis">Axis</button>
      </div>
    </section>

    <section class="control-section rotation-section">
      <div class="control-section__head">
        <span class="control-section__label">Rotation planes</span>
        <span class="control-section__note">auto</span>
      </div>
      <div id="rotationRows" class="control-rows"></div>
    </section>

    <section class="control-section scale-section">
      <div class="control-section__label">Axis scale</div>
      <div id="scaleRows" class="control-rows"></div>
    </section>
  </aside>

  <aside class="mandala-dock" aria-label="Mandala library">
    <div class="mandala-dock__preview">
      <canvas id="previewCanvas" width="150" height="150" aria-label="2D preview of selected mandala"></canvas>
      <span>2D preview</span>
    </div>
    <div class="mandala-dock__controls">
      <div class="mandala-dock__title">Mandala</div>
      <div class="preset-grid preset-grid--dock" id="presetControl">
        <button type="button" data-preset="square" class="is-active">Square</button>
        <button type="button" data-preset="yantra">Yantra</button>
        <button type="button" data-preset="hex">Hex</button>
      </div>
      <div class="dock-option">
        <span>Complexity</span>
        <div class="segmented" id="complexityControl">
          <button type="button" data-complexity="simple" class="is-active">Simple</button>
          <button type="button" data-complexity="complex">Complex</button>
        </div>
      </div>
      <div class="dock-option">
        <span>3D form</span>
        <div class="segmented" id="formControl">
          <button type="button" data-form="symmetric" class="is-active">Symmetric</button>
          <button type="button" data-form="temple">Temple</button>
        </div>
      </div>
    </div>
  </aside>

  <div class="basis-gizmo" id="basisGizmo" aria-label="Projected coordinate basis">
    <canvas id="basisCanvas" width="150" height="150"></canvas>
    <span>projected basis</span>
  </div>

  <div class="hint" id="hint">drag to orbit · scroll to zoom</div>

  <a class="source" href="https://github.com/jnton/hypermandala" target="_blank" rel="noreferrer">source</a>

  <noscript><div class="noscript">Hypermandala needs JavaScript to render the interactive geometry.</div></noscript>
  <script src="./app.js" defer></script>
</body>
</html>
