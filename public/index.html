<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#080807" />
  <meta name="description" content="A clean geometric mandala explored as a 2D plan, 3D temple and 4D sliced structure." />
  <title>Hypermandala</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <canvas id="mandala" aria-label="Interactive geometric mandala with coordinate axes and a fourth-dimensional slice plane"></canvas>

  <header class="brand">
    <div class="brand__name">Hypermandala</div>
    <div class="brand__tagline">one geometry · more dimensions</div>
  </header>

  <div class="dimension-readout" aria-live="polite">
    <strong id="dimensionValue">2D</strong>
    <span id="dimensionStatus">plan</span>
  </div>

  <div class="slice-readout" id="sliceReadout" aria-live="polite">
    <span>W slice</span>
    <strong id="sliceValue">0.00</strong>
  </div>

  <nav class="dimension-switcher" aria-label="Choose dimension">
    <button type="button" data-dimension="2" class="is-active">2D</button>
    <button type="button" data-dimension="3">3D</button>
    <button type="button" data-dimension="4">4D</button>
  </nav>

  <section class="axis-panel" aria-label="Coordinates and fourth-dimensional slice">
    <div class="axis-panel__head">
      <span>Position / slice</span>
      <button id="resetPosition" type="button">center</button>
    </div>
    <div id="axisRows" class="axis-rows"></div>
  </section>

  <div class="hint" id="hint">move X/Y · drag to rotate · scroll to zoom</div>

  <button class="reset-view" id="resetView" type="button" aria-label="Reset view">reset view</button>
  <a class="source" href="https://github.com/jnton/hypermandala" target="_blank" rel="noreferrer">source</a>

  <noscript><div class="noscript">Hypermandala needs JavaScript to render the interactive geometry.</div></noscript>
  <script src="./app.js" defer></script>
</body>
</html>
